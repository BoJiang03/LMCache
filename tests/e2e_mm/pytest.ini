[pytest]
; Local rootdir anchor: running pytest from THIS directory keeps the global
; tests/conftest.py (autouse mocks, allocator patches) out of a real-engine
; run. See tests/v1/cache_controller/pytest.ini for the same pattern.
addopts = -ra --strict-markers
markers =
    mm_e2e: multimodal acceptance test (real vLLM engine, GPU, opt-in via LMCACHE_MM_E2E=1)
    requires_modality(name): deselected (not skipped) for models whose spec lacks the modality
    requires_extra_suite(name): deselected (not skipped) for models whose spec lacks the add-on suite
    requires_media_prefix_stability: deselected for a model whose prompt is not append-only in media (ModelSpec.media_prefix_stable)
